<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTB DASHBOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#00ff88;--c:#00ccff;--r:#ff3355;--a:#ffaa00;--p:#bb66ff;
  --bg:#04060f;--pan:rgba(3,8,22,.91);--bdr:rgba(0,180,255,.17);
  --font:'Share Tech Mono','Courier New',monospace
}
body{background:var(--bg);color:#a0d8c8;font-family:var(--font);font-size:12px;overflow:hidden;height:100vh;user-select:none}
#gc{position:fixed;inset:0;width:100%;height:100%;z-index:0;cursor:grab}
#gc:active{cursor:grabbing}

/* layout */
#top{position:fixed;top:0;left:0;right:0;height:48px;z-index:20;
  display:flex;align-items:center;padding:0 16px;gap:18px;
  background:var(--pan);border-bottom:1px solid var(--bdr);backdrop-filter:blur(14px)}
#lp{position:fixed;top:56px;left:8px;bottom:62px;width:276px;z-index:20;
  background:var(--pan);border:1px solid var(--bdr);border-radius:4px;
  backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden}
#rp{position:fixed;top:56px;right:8px;bottom:62px;width:310px;z-index:20;
  background:var(--pan);border:1px solid var(--bdr);border-radius:4px;
  backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden}
#bot{position:fixed;bottom:8px;left:8px;right:8px;height:46px;z-index:20;
  background:var(--pan);border:1px solid var(--bdr);border-radius:4px;
  backdrop-filter:blur(14px);display:flex;align-items:center;padding:0 14px;gap:12px}

/* topbar */
.logo{color:var(--g);font-size:14px;letter-spacing:4px;text-shadow:0 0 16px var(--g);flex:1}
.sb{display:flex;flex-direction:column;align-items:center;min-width:64px}
.sl{color:rgba(0,200,255,.5);font-size:9px;letter-spacing:2px;text-transform:uppercase}
.sv{color:var(--c);font-size:13px;text-shadow:0 0 8px var(--c)}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;
  border:1px solid var(--bdr);border-radius:20px;background:rgba(0,0,0,.3)}
.dot{width:7px;height:7px;border-radius:50%;background:#444;transition:all .3s}
.dot.idle{background:#444}
.dot.running{background:var(--g);box-shadow:0 0 10px var(--g);animation:blink .9s infinite}
.dot.stopped,.dot.not_found{background:var(--r);box-shadow:0 0 10px var(--r)}
.dot.found,.dot.done{background:var(--a);box-shadow:0 0 14px var(--a)}
#st{font-size:11px;letter-spacing:2px;color:#aaddcc}

/* panel tabs */
.ptabs{display:flex;border-bottom:1px solid var(--bdr);flex-shrink:0}
.ptab{flex:1;padding:8px;font-family:var(--font);font-size:10px;letter-spacing:2px;
  text-transform:uppercase;background:transparent;border:none;
  color:rgba(0,200,255,.4);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.ptab.active{color:var(--c);border-bottom-color:var(--c)}
.ptab:hover:not(.active){color:var(--c)}

/* scrollable body */
.pbody{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pbody::-webkit-scrollbar{width:3px}
.pbody::-webkit-scrollbar-thumb{background:rgba(0,180,255,.25);border-radius:2px}

/* fields */
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{color:rgba(0,200,255,.5);font-size:9px;letter-spacing:2px;text-transform:uppercase}
.fld input,.fld textarea,.fld select{
  background:rgba(0,20,50,.75);border:1px solid rgba(0,150,255,.22);border-radius:2px;
  color:var(--g);font-family:var(--font);font-size:12px;padding:6px 9px;
  width:100%;outline:none;transition:border-color .2s;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:rgba(0,255,136,.5);box-shadow:0 0 8px rgba(0,255,136,.08)}
.fld select option{background:#0a1020}
.fld textarea{min-height:75px;line-height:1.5}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* section label */
.sec{color:rgba(0,200,255,.4);font-size:9px;letter-spacing:3px;text-transform:uppercase;
  padding:3px 0 2px;border-bottom:1px solid rgba(0,180,255,.1);margin-top:2px}

/* toggle rows */
.tabs,.mtabs{display:flex;gap:4px}
.tab,.mtab{flex:1;padding:5px;font-family:var(--font);font-size:10px;letter-spacing:2px;
  text-transform:uppercase;border:1px solid rgba(0,180,255,.22);border-radius:2px;
  background:transparent;cursor:pointer;transition:all .15s}
.tab{color:rgba(0,200,255,.45)}
.tab.active{border-color:var(--c);color:var(--c);background:rgba(0,200,255,.07)}
.mtab.get{color:rgba(0,200,255,.45)}
.mtab.get.active{border-color:var(--c);color:var(--c);background:rgba(0,200,255,.07)}
.mtab.post.active{border-color:var(--a);color:var(--a);background:rgba(255,170,0,.07)}
.tab:hover:not(.active),.mtab:hover:not(.active){color:var(--c);border-color:rgba(0,180,255,.4)}

/* chips */
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:3px 8px;font-family:var(--font);font-size:10px;
  border:1px solid rgba(0,180,255,.22);border-radius:20px;background:transparent;
  color:rgba(0,200,255,.55);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--c);color:var(--c);background:rgba(0,200,255,.07)}

/* buttons */
.btn{width:100%;padding:8px;font-family:var(--font);font-size:11px;letter-spacing:3px;
  text-transform:uppercase;border-radius:2px;cursor:pointer;transition:all .18s;
  border:1px solid;background:transparent}
.btn-go{border-color:var(--g);color:var(--g)}
.btn-go:hover:not(:disabled){background:var(--g);color:#000;box-shadow:0 0 18px var(--g)}
.btn-stp{border-color:var(--r);color:var(--r)}
.btn-stp:hover:not(:disabled){background:var(--r);color:#fff;box-shadow:0 0 18px var(--r)}
.btn:disabled{opacity:.3;cursor:not-allowed}

/* hint */
.hint{font-size:10px;color:rgba(0,200,255,.35);line-height:1.5}
.hint b{color:rgba(0,255,136,.5)}

/* log lines */
#log-body{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
#log-body::-webkit-scrollbar{width:3px}
#log-body::-webkit-scrollbar-thumb{background:rgba(0,180,255,.25);border-radius:2px}
.ll{font-size:11px;line-height:1.45;padding-left:6px;border-left:2px solid transparent;word-break:break-all}
.ll.info   {color:#88ccbb;border-color:rgba(0,200,255,.35)}
.ll.success{color:var(--g);border-color:var(--g);font-size:12px}
.ll.error  {color:var(--r);border-color:var(--r)}
.ll.warn   {color:var(--a);border-color:var(--a)}
.ll.hit    {color:var(--p);border-color:var(--p)}

/* findings panel */
#find-body{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#find-body::-webkit-scrollbar{width:3px}
#find-body::-webkit-scrollbar-thumb{background:rgba(0,180,255,.25);border-radius:2px}
.find-sect{color:var(--c);font-size:9px;letter-spacing:3px;text-transform:uppercase;
  padding:4px 0 2px;border-bottom:1px solid rgba(0,200,255,.15);margin-top:4px}
.port-row{display:grid;grid-template-columns:52px 80px 1fr auto;gap:6px;align-items:center;
  padding:5px 6px;background:rgba(0,20,50,.5);border:1px solid rgba(0,180,255,.12);border-radius:2px}
.port-num{color:var(--a);font-size:13px;letter-spacing:1px}
.port-svc{color:var(--c);font-size:11px}
.port-ban{color:rgba(160,216,200,.6);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atk-btn{padding:3px 8px;font-family:var(--font);font-size:9px;letter-spacing:1px;
  border:1px solid rgba(0,255,136,.4);border-radius:2px;background:transparent;
  color:rgba(0,255,136,.7);cursor:pointer;white-space:nowrap;transition:all .15s}
.atk-btn:hover{background:var(--g);color:#000;border-color:var(--g)}
.http-card{background:rgba(0,15,40,.6);border:1px solid rgba(0,180,255,.15);border-radius:3px;padding:7px 9px}
.http-url{color:var(--g);font-size:11px;margin-bottom:4px}
.http-meta{color:rgba(160,216,200,.55);font-size:10px;margin-bottom:4px}
.path-row{display:flex;gap:8px;font-size:10px;padding:2px 0}
.path-row .pth{color:#88ccbb;flex:1}
.path-row .psc{width:28px;text-align:right}
.psc.s200{color:var(--g)} .psc.s301,.psc.s302{color:var(--a)} .psc.s403{color:var(--r)}
.path-row .psz{color:rgba(160,216,200,.4);width:52px;text-align:right}

/* bottom bar */
#ppct{color:rgba(0,200,255,.6);font-size:10px;min-width:44px}
#ptr{flex:1;height:5px;background:rgba(0,40,80,.7);border-radius:3px;overflow:hidden}
#pfl{height:100%;width:0%;background:linear-gradient(90deg,#0055ff,#00ff88);border-radius:3px;
  box-shadow:0 0 10px rgba(0,255,136,.5);transition:width .08s linear}
#cur{color:var(--c);font-size:16px;letter-spacing:4px;text-shadow:0 0 12px var(--c);min-width:64px;text-align:right}

/* found overlay */
#fo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
  text-align:center;display:none;pointer-events:none}
#fo.show{display:block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
#fb{font-size:60px;color:var(--a);text-shadow:0 0 40px var(--a),0 0 80px var(--a);letter-spacing:10px}
#fv{margin-top:8px;padding:10px 18px;background:rgba(0,30,10,.9);
  border:1px solid var(--g);border-radius:3px;color:var(--g);font-size:13px;
  text-shadow:0 0 8px var(--g);max-width:480px;word-break:break-all}

/* animations */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.1}}
.pfl{animation:flash .3s ease-in-out 6}
</style>
</head>
<body>
<canvas id="gc"></canvas>

<!-- TOP BAR -->
<div id="top">
  <span class="logo">◉ HTB DASHBOARD</span>
  <div class="pill"><span class="dot idle" id="sd"></span><span id="st">IDLE</span></div>
  <div class="sb"><span class="sl">Tried</span><span class="sv" id="s-c">0</span></div>
  <div class="sb"><span class="sl">Rate</span><span class="sv" id="s-r">0/s</span></div>
  <div class="sb"><span class="sl">Progress</span><span class="sv" id="s-p">0%</span></div>
  <div class="sb"><span class="sl">Status</span><span class="sv" id="s-s">—</span></div>
  <div class="sb"><span class="sl">Size</span><span class="sv" id="s-z">—</span></div>
</div>

<!-- LEFT PANEL -->
<div id="lp">
  <div class="ptabs">
    <button class="ptab active" id="lt-scan" onclick="showLeft('scan')">Recon</button>
    <button class="ptab"        id="lt-atk"  onclick="showLeft('atk')">Attack</button>
  </div>

  <!-- RECON TAB -->
  <div id="ls-scan" class="pbody">
    <div class="sec">Target</div>
    <div class="fld"><label>IP / Hostname</label>
      <input id="s-host" placeholder="10.10.11.x or target.htb">
    </div>
    <div class="sec">Port Scope</div>
    <div class="tabs">
      <button class="tab active" id="pm-common" onclick="setPortMode('common')">Common</button>
      <button class="tab"        id="pm-all"    onclick="setPortMode('all')">All 65k</button>
      <button class="tab"        id="pm-custom" onclick="setPortMode('custom')">Range</button>
    </div>
    <div id="s-range" style="display:none">
      <div class="r2" style="margin-top:6px">
        <div class="fld"><label>From</label><input id="s-p1" type="number" value="1" min="1" max="65535"></div>
        <div class="fld"><label>To</label>  <input id="s-p2" type="number" value="10000" min="1" max="65535"></div>
      </div>
    </div>
    <div class="fld"><label>Threads</label><input id="s-threads" type="number" value="150" min="10" max="300"></div>
    <div class="hint">Scans open ports → grabs banners → auto-probes HTTP services</div>
    <button class="btn btn-go"  id="btn-scan" onclick="launchScan()">▶ Scan Target</button>
    <button class="btn btn-stp" id="btn-sstp" onclick="stopScan()" disabled>■ Stop</button>
  </div>

  <!-- ATTACK TAB -->
  <div id="ls-atk" class="pbody" style="display:none">
    <div class="sec">Target</div>
    <div class="fld"><label>URL</label>
      <input id="a-url" placeholder="http://IP:PORT/pin?pin={word}">
    </div>
    <div class="sec">Mode</div>
    <div class="tabs">
      <button class="tab active" id="am-num"  onclick="setAMode('numeric')">Numeric</button>
      <button class="tab"        id="am-word" onclick="setAMode('wordlist')">Wordlist</button>
    </div>
    <div id="as-num">
      <div class="r2" style="margin-top:6px">
        <div class="fld"><label>Start</label><input id="a-start" type="number" value="0" min="0" max="9999"></div>
        <div class="fld"><label>End</label>  <input id="a-end"   type="number" value="9999" min="0" max="9999"></div>
      </div>
    </div>
    <div id="as-word" style="display:none">
      <div class="chips" style="margin-top:6px">
        <button class="chip" onclick="loadPreset('passwords')">Passwords</button>
        <button class="chip" onclick="loadPreset('users')">Users</button>
        <button class="chip" onclick="loadPreset('dirs')">Dirs</button>
        <button class="chip" onclick="loadPreset('files')">Files</button>
        <button class="chip" onclick="loadPreset('api')">API</button>
        <button class="chip" onclick="loadPreset('lfi')">LFI</button>
      </div>
      <div class="fld" style="margin-top:6px">
        <label>Words <span id="wc" style="color:rgba(0,255,136,.4)"></span></label>
        <textarea id="a-words" oninput="updateWC()" placeholder="One word per line..."></textarea>
      </div>
    </div>
    <div class="sec">HTTP</div>
    <div class="mtabs">
      <button class="mtab get active" id="am-get"  onclick="setAMethod('get')">GET</button>
      <button class="mtab post"       id="am-post" onclick="setAMethod('post')">POST</button>
    </div>
    <div id="as-body" style="display:none;margin-top:6px">
      <div class="fld"><label>POST Body</label>
        <input id="a-body" placeholder="username=admin&password={word}">
      </div>
    </div>
    <details style="margin-top:2px">
      <summary style="color:rgba(0,200,255,.45);font-size:9px;letter-spacing:2px;cursor:pointer;padding:4px 0">HEADERS</summary>
      <div class="fld" style="margin-top:5px">
        <textarea id="a-hdrs" style="min-height:48px" placeholder="Cookie: session=abc&#10;Authorization: Bearer token"></textarea>
      </div>
    </details>
    <div class="sec">Detection</div>
    <div class="r2">
      <div class="fld"><label>JSON Key</label><input id="a-key"  placeholder="flag"></div>
      <div class="fld"><label>Status</label>  <input id="a-code" placeholder="200"></div>
    </div>
    <div class="fld"><label>Body Contains</label><input id="a-text" placeholder="HTB{"></div>
    <div class="fld"><label>Fail Contains</label> <input id="a-fail" placeholder="invalid"></div>
    <div class="fld"><label>Threads</label><input id="a-threads" type="number" value="10" min="1" max="50"></div>
    <button class="btn btn-go"  id="btn-atk" onclick="launchAttack()">▶ Launch</button>
    <button class="btn btn-stp" id="btn-astp" onclick="stopAttack()" disabled>■ Stop</button>
  </div>
</div>

<!-- RIGHT PANEL -->
<div id="rp">
  <div class="ptabs">
    <button class="ptab active" id="rt-find" onclick="showRight('find')">Findings</button>
    <button class="ptab"        id="rt-log"  onclick="showRight('log')">Log</button>
  </div>
  <div id="rs-find" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
    <div id="find-body">
      <div style="color:rgba(0,200,255,.3);font-size:11px;text-align:center;margin-top:30px">
        Run a recon scan to populate findings
      </div>
    </div>
  </div>
  <div id="rs-log" style="display:none;flex-direction:column;flex:1;overflow:hidden">
    <div style="display:flex;justify-content:flex-end;padding:4px 10px;flex-shrink:0">
      <button onclick="clearLog()" style="background:none;border:none;color:rgba(0,200,255,.35);cursor:pointer;font-family:var(--font);font-size:9px;letter-spacing:1px">CLEAR</button>
    </div>
    <div id="log-body"></div>
  </div>
</div>

<!-- BOTTOM -->
<div id="bot">
  <span id="ppct">0%</span>
  <div id="ptr"><div id="pfl"></div></div>
  <span id="cur">——</span>
</div>

<!-- FOUND OVERLAY -->
<div id="fo"><div id="fb">——</div><div id="fv">——</div></div>

<script>
// ═══════════════════════════════════════════════════════════
// THREE.JS GLOBE
// ═══════════════════════════════════════════════════════════
(function(){
  const canvas=document.getElementById('gc');
  const W=()=>window.innerWidth,H=()=>window.innerHeight;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W(),H());
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(45,W()/H(),.1,500);
  cam.position.set(0,0,2.6);
  cam.lookAt(0,0,0);

  // Stars
  const sb=new Float32Array(6000*3);
  for(let i=0;i<sb.length;i++)sb[i]=(Math.random()-.5)*400;
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(sb,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.08,transparent:true,opacity:.7})));

  const pivot=new THREE.Group(); scene.add(pivot);

  // Centre pivot in the visible gap between left (284px) and right (318px) panels
  function centerPivot(){
    const lp=284,rp=318,ww=W(),hh=H();
    const dxPx=(lp-rp)/2; // -17px, constant regardless of screen width
    const halfWWorld=Math.tan(22.5*Math.PI/180)*2.6*(ww/hh);
    pivot.position.x=(dxPx/(ww/2))*halfWWorld;
  }
  centerPivot();

  // Earth texture — Three.js's own texture via jsDelivr (CORS-safe)
  const loader=new THREE.TextureLoader();
  const earthTex=loader.load(
    'https://cdn.jsdelivr.net/npm/three@0.134.0/examples/textures/land_ocean_ice_cloud_2048.jpg',
    ()=>{globe.material.needsUpdate=true;},
    undefined,
    ()=>{ globe.material.color.setHex(0x1a4a6a); } // fallback if load fails
  );

  // Globe — real Earth look
  const globeMat=new THREE.MeshPhongMaterial({
    map:earthTex,
    specular:new THREE.Color(0x334466),
    shininess:12,
    emissive:new THREE.Color(0x000000),
  });
  const globe=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),globeMat);
  pivot.add(globe);

  // Thin atmosphere fringe (blue glow on edge)
  pivot.add(new THREE.Mesh(new THREE.SphereGeometry(1.04,64,64),
    new THREE.MeshBasicMaterial({color:0x2266ff,transparent:true,opacity:.06})));
  // Outer halo (back-side so it only shows around the rim)
  pivot.add(new THREE.Mesh(new THREE.SphereGeometry(1.15,64,64),
    new THREE.MeshBasicMaterial({color:0x0044cc,transparent:true,opacity:.04,side:THREE.BackSide})));

  // Orbit rings (show during scan)
  const makeRing=(rx,ry,rz,color)=>{
    const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,side:THREE.DoubleSide});
    const r=new THREE.Mesh(new THREE.TorusGeometry(1.1,.003,8,120),m);
    r.rotation.set(rx,ry,rz); pivot.add(r); return {r,m};
  };
  const ring1=makeRing(Math.PI/2,0,0,0x00ff88);
  const ring2=makeRing(0,0,Math.PI/3,0x00ccff);
  const ring3=makeRing(Math.PI/4,Math.PI/4,0,0x8855ff);

  // Lights — white sunlight so the texture reads correctly
  scene.add(new THREE.AmbientLight(0xffffff,.35));
  const sun=new THREE.DirectionalLight(0xffffff,1.1); sun.position.set(5,2,4); scene.add(sun);
  const fill=new THREE.DirectionalLight(0x334466,.4); fill.position.set(-4,-1,-3); scene.add(fill);

  // Helpers
  function ll(lat,lng,r=1.012){
    const phi=(90-lat)*Math.PI/180,theta=(lng+180)*Math.PI/180;
    return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
  }
  function makeDot(lat,lng,color){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(.016,10,10),new THREE.MeshBasicMaterial({color})));
    const hm=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.25});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(.032,10,10),hm));
    g.position.copy(ll(lat,lng)); pivot.add(g); return {g,hm};
  }
  function makeArc(lat1,lng1,lat2,lng2,color){
    const p1=ll(lat1,lng1),p2=ll(lat2,lng2);
    const mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(.5).normalize().multiplyScalar(1.55);
    const pts=new THREE.QuadraticBezierCurve3(p1,mid,p2).getPoints(80);
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const mat=new THREE.LineDashedMaterial({color,dashSize:.08,gapSize:.04,transparent:true,opacity:0});
    const line=new THREE.Line(geo,mat); line.computeLineDistances(); pivot.add(line); return {line,mat};
  }
  function makeRipple(lat,lng,color){
    const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,side:THREE.DoubleSide});
    const r=new THREE.Mesh(new THREE.RingGeometry(.01,.025,24),mat);
    const pos=ll(lat,lng); r.position.copy(pos);
    r.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),pos.clone().normalize());
    pivot.add(r); return {r,mat,t:Math.random()};
  }

  const dotA=makeDot(37.77,-122.42,0x00ff88);
  const dotT=makeDot(51.50,-.12,0xff3355);
  const arc =makeArc(37.77,-122.42,51.50,-.12,0x00ff88);
  const ripA=makeRipple(37.77,-122.42,0x00ff88);
  const ripT=makeRipple(51.50,-.12,0xff3355);

  window.G={pivot,arc,dotA,dotT,ripA,ripT,ring1,ring2,ring3,
            attacking:false,scanning:false,foundFlag:false,globe};

  // Mouse drag
  let drag=false,px=0,py=0;
  canvas.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY});
  window.addEventListener('mouseup',()=>drag=false);
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    pivot.rotation.y+=(e.clientX-px)*.005;
    pivot.rotation.x=Math.max(-1.2,Math.min(1.2,pivot.rotation.x+(e.clientY-py)*.003));
    px=e.clientX;py=e.clientY;
  });
  window.addEventListener('resize',()=>{
    renderer.setSize(W(),H());
    cam.aspect=W()/H();
    cam.updateProjectionMatrix();
    centerPivot();
  });

  let tick=0;
  function animate(){
    requestAnimationFrame(animate); tick+=.016;
    if(!drag)pivot.rotation.y+=G.foundFlag?.009:G.scanning?.004:.002;

    // Dot pulse
    const pA=.5+.5*Math.sin(tick*2.2),pT=.5+.5*Math.sin(tick*2.6+1.1);
    dotA.hm.opacity=.1+pA*.35; dotT.hm.opacity=.1+pT*.35;
    dotA.g.children[0].scale.setScalar(1+pA*.3); dotT.g.children[0].scale.setScalar(1+pT*.3);

    // Attack arc
    if(G.attacking){arc.mat.opacity=.4+.3*Math.sin(tick*4);arc.mat.dashOffset-=.018}
    else arc.mat.opacity=Math.max(arc.mat.opacity-.025,0);

    // Attack ripples
    [ripA,ripT].forEach(r=>{
      if(G.attacking){r.t=(r.t+.018)%1;r.r.scale.setScalar(.5+r.t*3);r.mat.opacity=(1-r.t)*.55}
      else r.mat.opacity=0;
    });
    ripT.t=(ripA.t+.45)%1;

    // Scan orbit rings
    [ring1,ring2,ring3].forEach((rg,i)=>{
      if(G.scanning){
        rg.m.opacity=Math.min(rg.m.opacity+.03,.5);
        rg.r.rotation.y+=.012*(i+1);
        rg.r.rotation.z+=.008*(i+1);
      } else {
        rg.m.opacity=Math.max(rg.m.opacity-.03,0);
      }
    });

    // Found/scan globe emissive tint (subtle so texture still reads)
    if(G.foundFlag)      globeMat.emissive.setHex(Math.floor(Math.abs(Math.sin(tick*6))*0x001a0a00));
    else if(G.scanning)  globeMat.emissive.setHex(Math.floor(Math.abs(Math.sin(tick*2))*0x00000a14));
    else                 globeMat.emissive.setHex(0x000000);

    renderer.render(scene,cam);
  }
  animate();
})();

// SOCKET.IO
// ═══════════════════════════════════════════════════════════
const socket=io();
socket.on('connect',   ()=>log('Connected','info'));
socket.on('disconnect',()=>log('Disconnected','warn'));

// ── Scan events ──
socket.on('scan_status',({state,host,ip,total})=>{
  const labels={running:'SCANNING',stopped:'STOPPED',done:'DONE',idle:'IDLE'};
  setStat(state,labels[state]??state.toUpperCase());
  G.scanning=(state==='running');
  if(state==='running'){
    document.getElementById('btn-scan').disabled=true;
    document.getElementById('btn-sstp').disabled=false;
    document.getElementById('s-c').textContent='0';
    if(host) log(`Scanning ${host} (${ip||host}) — ${total} ports`,'info');
  } else {
    document.getElementById('btn-scan').disabled=false;
    document.getElementById('btn-sstp').disabled=true;
  }
  showRight('find');
});

socket.on('scan_tick',({scanned,total,progress,rate})=>{
  document.getElementById('s-c').textContent=scanned.toLocaleString();
  document.getElementById('s-r').textContent=`${rate}/s`;
  document.getElementById('s-p').textContent=`${progress}%`;
  document.getElementById('pfl').style.width=`${progress}%`;
  document.getElementById('ppct').textContent=`${progress}%`;
  document.getElementById('cur').textContent=`${scanned}/${total}`;
});

socket.on('port_found',({port,service})=>{
  addPortRow(port,service,'','');
});

socket.on('banner',({port,banner})=>{
  const el=document.getElementById(`ban-${port}`);
  if(el) el.textContent=banner;
});

socket.on('http_found',({port,info})=>{
  updateHttpCard(port,info);
});

// ── Attack events ──
socket.on('attack_status',({state})=>{
  const labels={running:'ATTACKING',stopped:'STOPPED',not_found:'NOT FOUND',found:'FOUND!',idle:'IDLE'};
  setStat(state,labels[state]??state.toUpperCase());
  G.attacking=(state==='running');
  if(!G.attacking) G.foundFlag=false;
  document.getElementById('btn-atk').disabled= G.attacking;
  document.getElementById('btn-astp').disabled=!G.attacking;
  showRight('log');
});

socket.on('attempt',({word,status,size,hit,progress,rate,count})=>{
  document.getElementById('s-c').textContent=count?.toLocaleString()??'0';
  document.getElementById('s-r').textContent=`${rate??0}/s`;
  document.getElementById('s-p').textContent=`${(progress??0).toFixed(1)}%`;
  document.getElementById('s-s').textContent=status??'—';
  document.getElementById('s-z').textContent=size?`${size}b`:'—';
  document.getElementById('pfl').style.width=`${progress??0}%`;
  document.getElementById('ppct').textContent=`${(progress??0).toFixed(1)}%`;
  document.getElementById('cur').textContent=word??'——';
  if(hit) log(`HIT  ${word}  [${status}]  ${size}b`,'hit');
});

socket.on('found',({word,value})=>{
  G.attacking=false; G.foundFlag=true;
  setStat('found','FOUND!');
  document.getElementById('btn-atk').disabled=false;
  document.getElementById('btn-astp').disabled=true;
  document.getElementById('fb').textContent=word;
  document.getElementById('fv').textContent=value??'Access granted';
  document.getElementById('fo').classList.add('show');
  ['lp','rp','bot'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.add('pfl');
    el.addEventListener('animationend',()=>el.classList.remove('pfl'),{once:true});
  });
});

socket.on('log',({msg,type})=>log(msg,type));

socket.on('preset_data',({name,words})=>{
  document.getElementById('a-words').value=words.join('\n');
  updateWC();
  log(`Loaded ${words.length} ${name} entries`,'info');
});

// ═══════════════════════════════════════════════════════════
// FINDINGS PANEL
// ═══════════════════════════════════════════════════════════
const portRows={};  // port → row el
const httpCards={}; // port → card el

function clearFindings(){
  document.getElementById('find-body').innerHTML='';
  Object.keys(portRows).forEach(k=>delete portRows[k]);
  Object.keys(httpCards).forEach(k=>delete httpCards[k]);
}

function ensureSect(id,label){
  let el=document.getElementById('fs-'+id);
  if(!el){
    const fb=document.getElementById('find-body');
    // Remove placeholder
    const ph=fb.querySelector('div[style]');
    if(ph) ph.remove();
    el=document.createElement('div');
    el.id='fs-'+id;
    el.innerHTML=`<div class="find-sect">${label}</div>`;
    fb.appendChild(el);
  }
  return el;
}

function addPortRow(port,service,banner,ip){
  const sec=ensureSect('ports','Open Ports');
  if(portRows[port]) return; // already exists

  const row=document.createElement('div');
  row.className='port-row';
  row.innerHTML=`
    <span class="port-num">${port}</span>
    <span class="port-svc">${service}</span>
    <span class="port-ban" id="ban-${port}">${banner||'—'}</span>
    <button class="atk-btn" onclick="prefillAttack('${ip||document.getElementById('s-host').value}',${port},'${service}')">→ Atk</button>
  `;
  sec.appendChild(row);
  portRows[port]=row;
}

function updateHttpCard(port,info){
  const sec=ensureSect('http','Web Services');
  let card=httpCards[port];
  if(!card){
    card=document.createElement('div');
    card.className='http-card';
    sec.appendChild(card);
    httpCards[port]=card;
  }

  const statusClass=info.status>=400?'color:var(--r)':info.status>=300?'color:var(--a)':'color:var(--g)';
  const pathRows=(info.paths||[]).map(p=>{
    const sc=p.status; const cls=sc===200?'s200':sc===301||sc===302?'s301':sc===403?'s403':'';
    return `<div class="path-row">
      <span class="pth">${p.path}</span>
      <span class="psc ${cls}">${sc}</span>
      <span class="psz">${p.size}b</span>
    </div>`;
  }).join('');

  card.innerHTML=`
    <div class="http-url">${info.url}</div>
    <div class="http-meta" style="${statusClass}">
      ${info.status} ${info.title?`· "${info.title}"`:''} ${info.server?`· ${info.server}`:''}
    </div>
    ${pathRows}
    ${info.interesting?.map(i=>`<div class="http-meta" style="color:var(--a)">${i}</div>`).join('')||''}
  `;
}

// ═══════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════
function setStat(state,label){
  document.getElementById('sd').className=`dot ${state}`;
  document.getElementById('st').textContent=label;
}

function log(msg,type='info'){
  const c=document.getElementById('log-body');
  const ts=new Date().toLocaleTimeString('en-US',{hour12:false});
  const d=document.createElement('div');
  d.className=`ll ${type}`; d.textContent=`[${ts}] ${msg}`;
  c.appendChild(d);
  while(c.children.length>400) c.removeChild(c.firstChild);
  c.scrollTop=c.scrollHeight;
}
function clearLog(){document.getElementById('log-body').innerHTML=''}

function showLeft(tab){
  document.getElementById('ls-scan').style.display=tab==='scan'?'flex':'none';
  document.getElementById('ls-atk').style.display =tab==='atk' ?'flex':'none';
  document.getElementById('lt-scan').classList.toggle('active',tab==='scan');
  document.getElementById('lt-atk').classList.toggle('active',tab==='atk');
  if(tab==='scan') document.getElementById('ls-scan').style.flexDirection='column';
}
function showRight(tab){
  document.getElementById('rs-find').style.display=tab==='find'?'flex':'none';
  document.getElementById('rs-log').style.display =tab==='log' ?'flex':'none';
  document.getElementById('rt-find').classList.toggle('active',tab==='find');
  document.getElementById('rt-log').classList.toggle('active',tab==='log');
  if(tab==='find') document.getElementById('rs-find').style.flexDirection='column';
  if(tab==='log')  document.getElementById('rs-log').style.flexDirection='column';
}

// Port scope
let portMode='common';
function setPortMode(m){
  portMode=m;
  ['common','all','custom'].forEach(id=>{
    document.getElementById('pm-'+id).classList.toggle('active',id===m);
  });
  document.getElementById('s-range').style.display=m==='custom'?'block':'none';
}

// Attack mode
let aMode='numeric',aMethod='get';
function setAMode(m){
  aMode=m;
  document.getElementById('am-num').classList.toggle('active',m==='numeric');
  document.getElementById('am-word').classList.toggle('active',m==='wordlist');
  document.getElementById('as-num').style.display =m==='numeric' ?'block':'none';
  document.getElementById('as-word').style.display=m==='wordlist'?'block':'none';
}
function setAMethod(m){
  aMethod=m;
  document.getElementById('am-get').classList.toggle('active',m==='get');
  document.getElementById('am-post').classList.toggle('active',m==='post');
  document.getElementById('as-body').style.display=m==='post'?'block':'none';
}

function updateWC(){
  const words=document.getElementById('a-words').value.split('\n').filter(w=>w.trim());
  document.getElementById('wc').textContent=`(${words.length})`;
}

function loadPreset(name){
  socket.emit('get_preset',{name});
}

// Prefill attack from findings click
function prefillAttack(host,port,service){
  const isWeb=service.includes('HTTP')||service.includes('HTTPS')||port===80||port===443;
  const scheme=port===443||service==='HTTPS'?'https':'http';
  if(isWeb){
    document.getElementById('a-url').value=`${scheme}://${host}:${port}/{word}`;
    setAMode('wordlist');
    setAMethod('get');
    document.getElementById('a-code').value='200';
    document.getElementById('a-fail').value='';
    loadPreset('dirs');
  } else {
    document.getElementById('a-url').value=`http://${host}:${port}/{word}`;
  }
  showLeft('atk');
  log(`Pre-filled attack → ${host}:${port} (${service})`,'info');
}

// ── Launch scan ──
function launchScan(){
  const host=document.getElementById('s-host').value.trim();
  if(!host){log('Enter a target IP or hostname','error');return;}
  clearFindings();
  document.getElementById('fo').classList.remove('show');
  G.foundFlag=false;
  let pm=portMode;
  if(pm==='custom'){
    const a=document.getElementById('s-p1').value;
    const b=document.getElementById('s-p2').value;
    pm=`${a}-${b}`;
  }
  socket.emit('start_scan',{host,port_mode:pm,threads:document.getElementById('s-threads').value});
}
function stopScan(){socket.emit('stop_scan')}

// ── Launch attack ──
function launchAttack(){
  const url=document.getElementById('a-url').value.trim();
  if(!url){log('Enter a target URL','error');return;}
  const words=aMode==='wordlist'
    ?document.getElementById('a-words').value.split('\n').map(w=>w.trim()).filter(Boolean)
    :[];
  if(aMode==='wordlist'&&!words.length){log('Add words to list first','error');return;}
  document.getElementById('fo').classList.remove('show');
  G.foundFlag=false;
  socket.emit('start_attack',{
    url,mode:aMode,method:aMethod,
    body:   document.getElementById('a-body').value.trim(),
    headers:document.getElementById('a-hdrs').value,
    words,
    success_key: document.getElementById('a-key').value.trim(),
    success_code:document.getElementById('a-code').value.trim(),
    success_text:document.getElementById('a-text').value.trim(),
    fail_text:   document.getElementById('a-fail').value.trim(),
    threads:     document.getElementById('a-threads').value,
    start:       document.getElementById('a-start').value,
    end:         document.getElementById('a-end').value,
  });
}
function stopAttack(){socket.emit('stop_attack')}

document.getElementById('s-host').addEventListener('keydown',e=>{if(e.key==='Enter')launchScan()});
document.getElementById('a-url').addEventListener('keydown', e=>{if(e.key==='Enter')launchAttack()});
</script>
